[package]
# loa fork of biscuit-capi 7.0.0-alpha.1 (eclipse-biscuit/biscuit-rust tag
# biscuit-capi-7.0.0-alpha.1, f5b26d1), rebased on biscuit-auth 6.0.0 to stay
# byte-compatible with crates/loa-trust. Additions live in src/loa.rs.
name = "biscuit-capi"
version = "7.0.0-alpha.1+loa"
description = "C API for Biscuit"
authors = ["Geoffroy Couprie <contact@geoffroycouprie.com>"]
edition = "2018"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "biscuit_capi"
crate-type = ["staticlib"]

[features]
capi = []

[dependencies]
biscuit-auth = { version = "=6.0.0", default-features = false, features = [
    "datalog-macro",
    "serde-error",
    "pem",
] }
libc = "0.2"
rand = "0.8"

[profile.release]
panic = "abort"
