[package]
name = "loa-docs-golden"
version = "0.0.0"
edition = "2024"
[dependencies]
loa-surfaces = { path = "../../../../../crates/loa-surfaces", features = ["docs"] }
docx-rs = "0.4.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust_xlsxwriter = "0.103"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zip = { version = "9.7", default-features = false, features = ["deflate"] }
[workspace]
