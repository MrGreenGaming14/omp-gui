version = 1
theme = "dark"
project_tabs = true
pinned = ["s1"]
pinned_projects = ["loa"]
active_project = { name = "loa", cwd = "/src/loa" }

[harness]
default = "claude"
executables = { omp = "/opt/omp/bin/omp" }
approval_mode = "write"

[network]
port = 4242
relay = "https://relay.example.test"
discovery = { mdns = false, tailscale = true }

[updater]
check_interval_secs = 3600
pins = { omp = "19.0.0" }
github_token = "ghp_test"
trusted_keys = ["abcd"]

[unattended.approval]
timeout_secs = 120
answer = "deny"
reason = "nobody was around"

[unattended.form]
timeout_secs = 30
answer = '{"name": "x"}'

[surfaces]
video = false
browser_capture = "virtual-display"

[mcp_servers.files]
enabled = true
command = "mcp-files"
args = ["--root", "/srv"]
env = { LOG = "debug" }

[mcp_servers.search]
enabled = true
url = "https://mcp.example.test/sse"
headers = { "X-Team" = "a" }

[mcp_servers.old]
enabled = false
command = "old-server"

[remote_hosts.build]
host = "build.example.test"
user = "ci"
port = 2222
proxy_jump = "bastion"
allowed_paths = ["/srv/app", "/tmp/"]
read_only = false
commands = true
auto_approve = false

[projects.loa]
instructions = "Use iced."
pinned_files = ["docs/design/README.md"]
digest_role = "fast"
token_budget = 12000
disabled_tools = ["bash"]
disabled_mcp_tools = { files = ["delete"] }
