[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Shared third-party versions. Crates add anything else in their own Cargo.toml.
[workspace.dependencies]
loa-util = { path = "crates/loa-util" }
loa-core = { path = "crates/loa-core" }
loa-contracts = { path = "crates/loa-contracts" }
loa-harness = { path = "crates/loa-harness", default-features = false }
loa-ui-kit = { path = "crates/loa-ui-kit" }
loa-view = { path = "crates/loa-view" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
iced = { version = "0.14", features = ["tokio", "advanced", "markdown", "image", "canvas", "svg"] }
prost = "0.14"
schemars = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Smooth `cargo run`: iced/wgpu/cosmic-text code is generic and monomorphizes
# into our crates, so workspace crates get opt-level 1 and dependencies 3.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.build-override]
opt-level = 0

# CI compiles everything at opt-level 0. With the optimised dependencies above a
# cold cache took ~18 minutes, and the workspace crates, rebuilt on every run,
# compile ~3.5x faster than at opt-level 1. jpeg-decoder stays optimised:
# surface frame decoding is on the latency path, and at opt-level 0 a 1280x720
# screencast frame takes ~80 ms instead of ~4 ms.
[profile.ci]
inherits = "dev"
opt-level = 0

[profile.ci.package."*"]
opt-level = 0

[profile.ci.package.jpeg-decoder]
opt-level = 3
