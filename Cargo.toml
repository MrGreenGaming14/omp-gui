[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Shared third-party versions. Crates add anything else in their own Cargo.toml.
[workspace.dependencies]
loa-util = { path = "crates/loa-util" }
loa-core = { path = "crates/loa-core" }
loa-contracts = { path = "crates/loa-contracts" }
loa-harness = { path = "crates/loa-harness", default-features = false }
loa-ui-kit = { path = "crates/loa-ui-kit" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
iced = { version = "0.14", features = ["tokio", "advanced", "markdown", "image", "canvas", "svg"] }
prost = "0.14"
schemars = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Surface frame decoding is on the latency path even in debug builds.
[profile.dev.package.jpeg-decoder]
opt-level = 3
