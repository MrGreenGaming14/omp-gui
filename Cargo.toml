[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Shared third-party versions. Crates add anything else in their own Cargo.toml.
[workspace.dependencies]
loa-core = { path = "crates/loa-core" }
loa-adapter = { path = "crates/loa-adapter" }
loa-surface = { path = "crates/loa-surface" }
loa-ui-icons = { path = "crates/loa-ui-icons" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
iced = { version = "0.14", features = ["tokio", "advanced", "markdown", "image", "canvas", "svg"] }
prost = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Smooth `cargo run`: iced/wgpu/cosmic-text code is generic and monomorphizes
# into our crates, so workspace crates get opt-level 1 and dependencies 3.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.build-override]
opt-level = 0
