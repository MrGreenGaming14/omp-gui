[package]
name = "loa-p2p"
description = "The peer node: QUIC/TCP transports, discovery, grants over the wire and session sharing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
loa-core.workspace = true
loa-config = { path = "../loa-config" }
loa-bus = { path = "../loa-bus" }
loa-trust = { path = "../loa-trust" }
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
mdns-sd = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
yamux = "0.14"
tokio-util = { version = "0.7", features = ["compat"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
