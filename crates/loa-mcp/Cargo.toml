[package]
name = "loa-mcp"
description = "MCP client, server registry and config import"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
futures.workspace = true
http = "1"
loa-adapter.workspace = true
loa-config = { path = "../loa-config" }
loa-surface.workspace = true
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.11", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
toml = "1"
tokio-util = "0.7"
tracing.workspace = true
url = "2"
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
libtest-mimic = "0.8"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tempfile.workspace = true

[[test]]
name = "client"
harness = false
