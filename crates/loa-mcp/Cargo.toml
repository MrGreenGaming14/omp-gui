[package]
name = "loa-mcp"
description = "MCP client, server registry, config import, tool serving and the omp tools bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
futures.workspace = true
http = "1"
loa-contracts.workspace = true
loa-config = { path = "../loa-config" }
loa-harness = { workspace = true, features = ["omp"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.11", default-features = false, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
toml = "1"
tokio-util = "0.7"
tracing.workspace = true
url = "2"
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
libtest-mimic = "0.8"
loa-harness = { workspace = true, features = ["omp", "testing"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
tempfile.workspace = true

[[test]]
name = "mcp"
harness = false
