[package]
name = "loa-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
iced.workspace = true
async-trait.workspace = true
loa-core.workspace = true
loa-contracts.workspace = true
loa-view.workspace = true
loa-bus = { path = "../loa-bus" }
loa-settings = { path = "../loa-settings" }
loa-harness = { workspace = true, features = ["omp", "acp", "claude", "codex", "opencode", "omp2"] }
loa-session = { path = "../loa-session" }
loa-runtime = { path = "../loa-runtime" }
tokio.workspace = true
loa-ui-shell = { path = "../loa-ui-shell" }
loa-ui-session = { path = "../loa-ui-session" }
loa-ui-panel = { path = "../loa-ui-panel" }
loa-ui-terminal = { path = "../loa-ui-terminal" }
loa-models = { path = "../loa-models" }
loa-ui-settings = { path = "../loa-ui-settings" }
loa-ui-surface = { path = "../loa-ui-surface" }
loa-surfaces = { path = "../loa-surfaces" }
loa-projects = { path = "../loa-projects" }
loa-mcp = { path = "../loa-mcp" }
loa-remote = { path = "../loa-remote" }
loa-trust = { path = "../loa-trust" }
bytes.workspace = true
loa-ui-kit = { path = "../loa-ui-kit" }
loa-p2p = { path = "../loa-p2p" }
loa-updater = { path = "../loa-updater" }
futures.workspace = true
tempfile.workspace = true
semver = "1"
loa-sandbox = { path = "../loa-sandbox" }
serde_json.workspace = true
notify-rust = "4.19"

[features]
# Live video for peers: the "Live video" launcher toggle and in-process H.264.
remote-video = ["loa-surfaces/remote-video", "loa-ui-surface/remote-video"]
# The Firecracker and qemu sandbox providers and their settings.
sandbox-vm = ["loa-sandbox/vm"]

[dev-dependencies]
loa-models = { path = "../loa-models", features = ["testing"] }
loa-harness = { workspace = true, features = ["testing"] }
loa-ui-kit = { path = "../loa-ui-kit", features = ["testkit"] }
iced_runtime = "0.14"
# The iced runtime's subscription tracker, to run the app's subscriptions in tests.
iced_futures = "0.14"
toml = "1.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rust_xlsxwriter = "0.103"
