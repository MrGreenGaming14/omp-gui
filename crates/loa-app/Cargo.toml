[package]
name = "loa-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
iced.workspace = true
async-trait.workspace = true
loa-core.workspace = true
loa-contracts.workspace = true
loa-bus = { path = "../loa-bus" }
loa-config = { path = "../loa-config" }
loa-harness = { workspace = true, features = ["omp", "acp", "claude", "codex", "opencode", "omp2"] }
tokio.workspace = true
loa-ui-shell = { path = "../loa-ui-shell" }
loa-ui-chat = { path = "../loa-ui-chat" }
loa-ui-composer = { path = "../loa-ui-composer" }
loa-ui-decisions = { path = "../loa-ui-decisions" }
loa-ui-panel = { path = "../loa-ui-panel" }
loa-ui-terminal = { path = "../loa-ui-terminal" }
loa-ui-palette = { path = "../loa-ui-palette" }
loa-ui-tools = { path = "../loa-ui-tools" }
loa-ui-models = { path = "../loa-ui-models" }
loa-models = { path = "../loa-models" }
loa-ui-peers = { path = "../loa-ui-peers" }
loa-ui-surface = { path = "../loa-ui-surface" }
loa-surface-hub = { path = "../loa-surface-hub" }
loa-projects = { path = "../loa-projects" }
loa-ui-projects = { path = "../loa-ui-projects" }
loa-mcp = { path = "../loa-mcp" }
loa-remote = { path = "../loa-remote" }
loa-trust = { path = "../loa-trust" }
bytes.workspace = true
loa-ui-kit = { path = "../loa-ui-kit" }
loa-p2p = { path = "../loa-p2p" }
loa-updater = { path = "../loa-updater" }
futures.workspace = true
tempfile.workspace = true
loa-ui-updates = { path = "../loa-ui-updates" }
semver = "1"
loa-sandbox = { path = "../loa-sandbox" }
serde_json.workspace = true

[features]
# Live video for peers: the "Live video" launcher toggle and in-process H.264.
remote-video = ["loa-surface-hub/remote-video", "loa-ui-surface/remote-video"]

[dev-dependencies]
iced_runtime = "0.14"
# The iced runtime's subscription tracker, to run the app's subscriptions in tests.
iced_futures = "0.14"
tempfile.workspace = true
iced_test = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
# The in-process SSH server of loa-remote's tests, for the Remote hosts tests.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
rand = "0.10"
tokio-stream = { version = "0.1", features = ["net"] }
