[package]
name = "loa-net"
description = "iroh endpoint on 31415, ALPNs, TCP fallback, relay and discovery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-config = { path = "../loa-config" }
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
mdns-sd = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
yamux = "0.14"
tokio-util = { version = "0.7", features = ["compat"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }

[dev-dependencies]
loa-util.workspace = true
tempfile.workspace = true
