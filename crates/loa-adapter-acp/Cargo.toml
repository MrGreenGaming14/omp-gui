[package]
name = "loa-adapter-acp"
description = "Generic Agent Client Protocol adapter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-exec = { path = "../loa-exec" }
loa-core.workspace = true
loa-adapter.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
