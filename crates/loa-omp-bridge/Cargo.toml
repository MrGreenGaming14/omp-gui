[package]
name = "loa-omp-bridge"
description = "omp tools served to other harnesses as an MCP server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
async-trait.workspace = true
bytes.workspace = true
loa-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile.workspace = true
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "transport-io"] }
