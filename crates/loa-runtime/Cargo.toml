[package]
name = "loa-runtime"
description = "The headless app runtime: live sessions, the harness registry and the active project"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
loa-core.workspace = true
loa-contracts.workspace = true
loa-bus = { path = "../loa-bus" }
loa-session = { path = "../loa-session" }
tokio.workspace = true
futures.workspace = true

[dev-dependencies]
# Every adapter compiled in, as in the app: with fewer, loa-harness warns about unused helpers.
loa-harness = { path = "../loa-harness", features = ["testing"] }
async-trait.workspace = true
tempfile.workspace = true
