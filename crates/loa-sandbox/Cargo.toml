[package]
name = "loa-sandbox"
description = "sandbox_task tool and its providers"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["host"]
# Everything but the wire protocol. The stub builds without it.
host = [
    "dep:loa-core",
    "dep:loa-contracts",
    "dep:async-trait",
    "dep:schemars",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tempfile",
    "dep:tar",
]
# Firecracker and qemu providers.
vm = ["host"]
# ovnfs checkouts for isolated runs.
ovnfs = ["host"]

[dependencies]
loa-util.workspace = true
postcard = { version = "1", features = ["use-std"] }
serde.workspace = true
loa-core = { workspace = true, optional = true }
loa-contracts = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["io-util"], optional = true }
tempfile = { workspace = true, optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
