[package]
name = "loa-identity"
description = "Node identity: one ed25519 keypair in the OS keychain"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
data-encoding = "2"
zeroize = "1"
# Default `v1` feature: Secret Service over zbus with pure Rust crypto on Linux/BSD,
# Keychain Services on macOS, Credential Manager on Windows. No system headers needed.
keyring = "4.2"

[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_SystemServices", "Win32_System_Threading",
] }

[dev-dependencies]
iroh-base = { version = "1.5", default-features = false, features = ["key"] }
biscuit-auth = "6"
