[package]
name = "loa-surface-browser"
description = "Browser surface server on headless Chrome"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-core.workspace = true
loa-surface.workspace = true
loa-exec = { path = "../loa-exec" }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22"
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes", "rustls", "zip8"] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
