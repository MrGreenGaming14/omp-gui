[package]
name = "loa-projects"
description = "Session digests, project context, project_search and project_read"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-core.workspace = true
loa-adapter.workspace = true
loa-bus = { path = "../loa-bus" }
loa-journal = { path = "../loa-journal" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "sync", "io-util", "rt", "macros", "fs"] }
tracing.workspace = true

[dev-dependencies]
loa-exec = { path = "../loa-exec" }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
loa-adapter-omp = { path = "../loa-adapter-omp" }
