[package]
name = "loa-projects"
description = "Session digests, project context, project_search and project_read"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
loa-core.workspace = true
loa-contracts.workspace = true
loa-bus = { path = "../loa-bus" }
loa-settings = { path = "../loa-settings" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "sync", "io-util", "rt", "macros", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
loa-bus = { path = "../loa-bus", features = ["testkit"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
