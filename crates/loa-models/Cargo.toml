[package]
name = "loa-models"
description = "Sign in, model listing and model settings through omp and other harnesses"
version.workspace = true
edition.workspace = true
publish.workspace = true
[features]
testing = ["tokio/time"]


[dependencies]
loa-util.workspace = true
loa-contracts.workspace = true
loa-settings = { path = "../loa-settings" }
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "sync", "macros", "io-util", "rt"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
