[package]
name = "loa-models"
description = "Sign in, model listing and model settings through omp and other harnesses"
version.workspace = true
edition.workspace = true
publish.workspace = true
[features]
testing = ["tokio/time"]


[dependencies]
loa-util.workspace = true
loa-contracts.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "sync", "macros", "io-util", "rt"] }
yaml-rust2 = "0.13"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
