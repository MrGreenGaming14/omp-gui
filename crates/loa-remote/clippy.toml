# Private key material is never read by this crate: authentication goes
# through ssh-agent only. Every loader and decoder of private keys is banned.
disallowed-methods = [
    { path = "russh::keys::load_secret_key", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::decode_secret_key", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::load_openssh_certificate", reason = "identities come from ssh-agent only" },
    { path = "russh::keys::PrivateKey::from_openssh", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::PrivateKey::from_ppk", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::PrivateKey::from_bytes", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::PrivateKey::read_openssh", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::keys::PrivateKey::read_openssh_file", reason = "private keys are never read; authenticate through ssh-agent" },
    { path = "russh::client::Handle::authenticate_publickey", reason = "only agent backed authentication (authenticate_publickey_with)" },
    { path = "russh::client::Handle::authenticate_openssh_cert", reason = "only agent backed authentication (authenticate_certificate_with)" },
    { path = "russh::client::Handle::authenticate_password", reason = "only agent backed authentication" },
]
