[package]
name = "loa-updater"
description = "Release watching, staging, gate checks, swap and rollback"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures.workspace = true
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4.46"
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
webpki-roots = "1"
zip = { version = "9.7", default-features = false, features = ["deflate"] }

[dev-dependencies]
loa-test-exec = { path = "../loa-test-exec" }
axum = "0.8"
