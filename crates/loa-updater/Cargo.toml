[package]
name = "loa-updater"
description = "Release watching, staging, gate checks, swap and rollback"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["service"]
# Feeds, staging, signatures, swaps and the Updater; without it: model, gates, decisions and peers only.
service = ["dep:base64", "dep:ed25519-dalek", "dep:flate2", "dep:hex", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:tar", "dep:tempfile", "dep:tokio", "dep:tracing", "dep:webpki-roots", "dep:zip"]

[dependencies]
loa-util.workspace = true
async-trait.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
futures.workspace = true
hex = { version = "0.4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
webpki-roots = { version = "1", optional = true }
zip = { version = "9.7", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
axum = "0.8"
