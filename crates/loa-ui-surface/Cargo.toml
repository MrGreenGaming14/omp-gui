[package]
name = "loa-ui-surface"
description = "Surface renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-view.workspace = true
loa-ui-kit.workspace = true
iced.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true

[features]
# The launcher's live video toggle for viewers across the network.
remote-video = []

[dev-dependencies]
iced_runtime = "0.14"
iced_test = "0.14"
tempfile.workspace = true
async-trait.workspace = true
# Reads the canvas snapshots back.
image = { version = "0.25", default-features = false, features = ["png"] }
