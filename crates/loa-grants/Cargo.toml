[package]
name = "loa-grants"
description = "Biscuit grants bound to node keys"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
loa-util.workspace = true
loa-core.workspace = true
loa-contracts.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# biscuit-auth 6.0.0 doesn't compile without `datalog-macro` (its builder
# modules import `ToAnyParam` unconditionally).
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro"] }
getrandom = "0.3"
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
