name: ci
on:
  push:
    branches: [main, cpp-rewrite]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The vendored iroh and biscuit FFI forks (cpp/libs/iroh_ffi, cpp/libs/biscuit_ffi) are
  # prebuilt with cargo into this directory; it is cached between runs.
  LOA_RUST_FFI_TARGET: ${{ github.workspace }}/.ffi-target
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the F1 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache qt6-base-dev qt6-pdf-dev qt6-svg-dev qt6-tools-dev qt6-image-formats-plugins libsqlite3-dev libssl-dev libcurl4-openssl-dev libssh-dev libvterm-dev libarchive-dev libsecret-1-dev libjpeg-turbo8-dev libpng-dev libwebp-dev libgif-dev zlib1g-dev libopenh264-dev libtomlplusplus-dev doctest-dev libasio-dev libpugixml-dev libxlsxwriter-dev libcpp-httplib-dev libstb-dev libnotify-dev libxcb1-dev libxcb-shm0-dev libxcb-xtest0-dev libmd4c-dev libyaml-cpp-dev libminizip-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            .ccache
            .ffi-target
          key: linux-${{ hashFiles('cpp/libs/*_ffi/fork/Cargo.lock') }}-${{ github.sha }}
          restore-keys: linux-${{ hashFiles('cpp/libs/*_ffi/fork/Cargo.lock') }}-
      - run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build
      # ctest runs every loa_*_tests target, the API and theme lints and the loa-qt smoke screens.
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - run: QT_QPA_PLATFORM=offscreen timeout 5 ./build/app/loa-qt --smoke shell

  # macOS and Windows build from cpp/vcpkg.json with Qt from aqtinstall. Only Linux is verified
  # (docs/ARCHITECTURE.md, "Platforms"), so these jobs report without gating merges.
  macos:
    runs-on: macos-14
    continue-on-error: true
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja ccache
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.*'
          modules: qtpdf qtimageformats
      - name: Bootstrap vcpkg
        run: git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT" && "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - run: >
          cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install -y ninja ccache
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.*'
          arch: win64_msvc2019_64
          modules: qtpdf qtimageformats
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - shell: pwsh
        run: >
          cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
