name: ci
on:
  push:
    branches: [main, tai-dev]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
      - name: Install OMP for bridge integration tests
        shell: bash
        run: |
          dir="$RUNNER_TEMP/loa-ci-omp"
          mkdir -p "$dir"
          cd "$dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/can1357/oh-my-pi/releases/download/v19.0.0/omp-linux-x64 -o omp
          echo 'c7cc5c8d505053c8ffaf180417e5d5c781235b9d936f286810560151120109bf  omp' | sha256sum --check
          chmod +x omp
          echo "$dir" >> "$GITHUB_PATH"
      - run: cargo build --workspace --all-targets --profile ci
      - run: xvfb-run -a cargo test --workspace --profile ci
